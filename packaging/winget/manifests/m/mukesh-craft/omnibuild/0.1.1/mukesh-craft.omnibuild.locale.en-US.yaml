ShortDescription: Local-first build orchestration and artifact verification
Description: |-
  OmniBuild detects a project, plans a build for a target, invokes the
  appropriate toolchain, inspects the result, runs it when possible, and writes
  manifests, hashes, cache entries and release archives. It records whether an
  artifact was built, inspected or actually executed instead of treating a
  successful compiler exit as proof that it works.
