[package]
name = "omnibuild"
version = "0.1.0"
edition = "2024"
description = "Universal build orchestration and artifact verification"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
object = { version = "0.40", features = ["wasm"] }
walkdir = "2.5"
which = "8"

[profile.release]
strip = true
lto = "thin"
